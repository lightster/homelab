apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: memento
spec:
  ports:
    - name: s3
      port: 3900
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: garage
  namespace: memento
  labels:
    kubernetes.io/service-name: garage
    endpointslice.kubernetes.io/managed-by: homelab
addressType: IPv4
ports:
  - name: s3
    port: 3900
    protocol: TCP
endpoints:
  - addresses:
      - 10.38.194.15
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: files
  namespace: memento
spec:
  parentRefs:
    - name: public
      namespace: kube-system
  hostnames:
    - files.memento.day
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /memento
      backendRefs:
        - name: garage
          port: 3900
