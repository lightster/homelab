---
# Terraform seeds these keys into a guest when it is created and cannot change
# them afterwards, so adding a key to ssh_keys.pub only reaches existing guests
# through this role.
- name: Authorize the shared SSH public keys
  ansible.posix.authorized_key:
    user: "{{ ssh_keys_user }}"
    key: "{{ lookup('ansible.builtin.file', ssh_keys_file) }}"
    state: present
