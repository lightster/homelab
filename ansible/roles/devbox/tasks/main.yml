---
- name: Grant passwordless sudo to the dev user
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ devbox_user }}"
    content: "{{ devbox_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: visudo -cf %s

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ devbox_base_packages }}"
    state: present
    update_cache: true

- name: Add dev user to sudo and docker groups
  ansible.builtin.user:
    name: "{{ devbox_user }}"
    groups:
      - sudo
      - docker
    append: true

- name: Set zsh as the dev user's default shell
  ansible.builtin.user:
    name: "{{ devbox_user }}"
    shell: /usr/bin/zsh

- name: Replace the default MOTD with an ASCII banner
  ansible.builtin.copy:
    dest: /etc/motd
    mode: "0644"
    content: |2

       _           _          __
      | |__   ___ | |__     ('>
      | '_ \ / _ \| '_ \     /rr
      | |_) | (_) | |_) |   *\))_
      |_.__/ \___/|_.__/

- name: Suppress the kernel-version line from the dynamic MOTD
  ansible.builtin.file:
    path: /etc/update-motd.d/10-uname
    state: absent

- name: Add mise apt repo
  ansible.builtin.deb822_repository:
    name: mise
    types: deb
    uris: https://mise.jdx.dev/deb
    suites: stable
    components: main
    architectures: amd64
    signed_by: https://mise.jdx.dev/gpg-key.pub
    state: present

- name: Install mise
  ansible.builtin.apt:
    name: mise
    state: present
    update_cache: true

- name: Expose mise runtimes to login shells
  ansible.builtin.copy:
    dest: /etc/profile.d/mise.sh
    mode: "0644"
    content: |
      if [ -d "$HOME/.local/share/mise/shims" ]; then
        PATH="$HOME/.local/share/mise/shims:$PATH"
      fi

- name: Activate mise in the dev user's interactive shell
  ansible.builtin.lineinfile:
    path: "/home/{{ devbox_user }}/.bashrc"
    line: 'eval "$(mise activate bash)"'
    create: true
    owner: "{{ devbox_user }}"
    group: "{{ devbox_user }}"
    mode: "0644"

- name: Expose ~/.local/bin to login shells
  ansible.builtin.copy:
    dest: /etc/profile.d/local-bin.sh
    mode: "0644"
    content: |
      if [ -d "$HOME/.local/bin" ]; then
        PATH="$HOME/.local/bin:$PATH"
      fi

- name: Check whether Claude Code is already installed
  ansible.builtin.stat:
    path: "/home/{{ devbox_user }}/.local/bin/claude"
  become: false
  register: devbox_claude_binary

- name: Install Claude Code via the native installer
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://claude.ai/install.sh | bash
    executable: /bin/bash
  become: false
  when: not devbox_claude_binary.stat.exists
  changed_when: true

- name: Allow bubblewrap unprivileged user namespaces via AppArmor
  ansible.builtin.copy:
    dest: /etc/apparmor.d/bwrap
    mode: "0644"
    content: |
      abi <abi/4.0>,
      include <tunables/global>

      profile bwrap /usr/bin/bwrap flags=(unconfined) {
        userns,
        include if exists <local/bwrap>
      }
  notify: Reload AppArmor

- name: Accept COLORTERM from the SSH client for truecolor detection
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-acceptenv-colorterm.conf
    mode: "0644"
    content: |
      AcceptEnv COLORTERM
    validate: sshd -t -f %s
  notify: Restart ssh

- name: Raise inotify watch limit for IDE indexing
  ansible.posix.sysctl:
    name: fs.inotify.max_user_watches
    value: "{{ devbox_inotify_max_user_watches }}"
    sysctl_file: /etc/sysctl.d/99-devbox.conf
    reload: true

- name: Enable the SysRq keys needed for out-of-band recovery
  ansible.posix.sysctl:
    name: kernel.sysrq
    value: "{{ devbox_kernel_sysrq }}"
    sysctl_file: /etc/sysctl.d/99-devbox.conf
    reload: true

- name: Create and format the swapfile
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      dd if=/dev/zero of={{ devbox_swapfile_path }}.tmp bs=1M count={{ devbox_swapfile_size_mb }}
      chmod 0600 {{ devbox_swapfile_path }}.tmp
      mkswap {{ devbox_swapfile_path }}.tmp
      mv {{ devbox_swapfile_path }}.tmp {{ devbox_swapfile_path }}
    executable: /bin/bash
    creates: "{{ devbox_swapfile_path }}"

- name: Add the swapfile to fstab
  ansible.posix.mount:
    path: none
    src: "{{ devbox_swapfile_path }}"
    fstype: swap
    opts: sw
    state: present

- name: Check which swap devices are active
  ansible.builtin.command:
    cmd: swapon --show=NAME --noheadings
  register: devbox_active_swap
  changed_when: false

- name: Activate the swapfile
  ansible.builtin.command:
    cmd: swapon {{ devbox_swapfile_path }}
  when: devbox_swapfile_path not in devbox_active_swap.stdout_lines

- name: Install earlyoom
  ansible.builtin.apt:
    name: earlyoom
    state: present
    update_cache: true

- name: Configure earlyoom to spare the interactive session
  ansible.builtin.copy:
    dest: /etc/default/earlyoom
    mode: "0644"
    content: |
      EARLYOOM_ARGS="-r {{ devbox_earlyoom_report_interval }} -p --avoid {{ devbox_earlyoom_avoid_regex }}"
  notify: Restart earlyoom

- name: Ensure earlyoom is running
  ansible.builtin.service:
    name: earlyoom
    state: started
    enabled: true
