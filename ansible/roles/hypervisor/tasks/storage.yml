---
- name: Check whether the ZFS pool is imported
  ansible.builtin.command: "zpool list -H -o name {{ hypervisor_zfs_pool }}"
  register: zfs_pool
  changed_when: false
  failed_when: false

- name: Fail if the ZFS pool does not exist
  ansible.builtin.fail:
    msg: >-
      ZFS pool '{{ hypervisor_zfs_pool }}' is not imported. If it already exists
      on disk (e.g. after a Proxmox reinstall), run `zpool import
      {{ hypervisor_zfs_pool }}` on the host. Otherwise, creating it is a
      one-time manual step documented in docs/bootstrap.md. This role does not
      create pools, because a role that provisions storage when it finds none
      will eventually provision it on the wrong device.
  when: zfs_pool.rc != 0

- name: Pin the ZFS ARC ceiling for subsequent boots
  ansible.builtin.copy:
    dest: /etc/modprobe.d/zfs.conf
    mode: "0644"
    content: |
      # Proxmox only writes an ARC limit when its installer creates a ZFS root.
      # This host boots from LVM, so without this file OpenZFS would default to
      # half of RAM on a host whose memory belongs to the guests.
      options zfs zfs_arc_max={{ (hypervisor_zfs_arc_max_gb | int) * 1073741824 }}
  notify: Update initramfs

- name: Read the running ARC ceiling
  ansible.builtin.slurp:
    src: /sys/module/zfs/parameters/zfs_arc_max
  register: zfs_arc_running

- name: Apply the ARC ceiling to the running kernel
  ansible.builtin.shell: >-
    echo {{ (hypervisor_zfs_arc_max_gb | int) * 1073741824 }}
    > /sys/module/zfs/parameters/zfs_arc_max
  when: >-
    (zfs_arc_running.content | b64decode | trim | int)
    != ((hypervisor_zfs_arc_max_gb | int) * 1073741824)
  changed_when: true

- name: Enforce inherited properties on the pool root
  community.general.zfs:
    name: "{{ hypervisor_zfs_pool }}"
    state: present
    extra_zfs_properties: "{{ hypervisor_zfs_pool_properties }}"

- name: Ensure the ZFS datasets exist
  community.general.zfs:
    name: "{{ hypervisor_zfs_pool }}/{{ item }}"
    state: present
  loop: "{{ hypervisor_zfs_datasets }}"

- name: Read the configured Proxmox storages
  ansible.builtin.command: /usr/bin/pvesh get /storage --output-format json
  register: pve_storages
  changed_when: false

# Scoped to the vm dataset so Proxmox-managed volumes stay out of the rest of the
# pool; tank/data is host-level storage for bind mounts.
- name: Register the ZFS dataset as a Proxmox storage
  ansible.builtin.command: >-
    /usr/sbin/pvesm add zfspool {{ hypervisor_zfs_storage_id }}
    --pool {{ hypervisor_zfs_pool }}/vm
    --content images,rootdir
  when: >-
    hypervisor_zfs_storage_id not in
    (pve_storages.stdout | from_json | map(attribute='storage') | list)
  changed_when: true
