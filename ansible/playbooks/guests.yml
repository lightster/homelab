---
- name: Configure Postgres guest
  hosts: postgres
  roles:
    - ssh_keys
    - postgres

- name: Configure dev guest
  hosts: dev
  roles:
    - ssh_keys
    - tailscale
    - docker
    - devbox

- name: Configure apps guest
  hosts: apps
  roles:
    - ssh_keys
    - tailscale
    - k3s

- name: Configure Garage guest
  hosts: garage
  roles:
    - ssh_keys
    - garage
