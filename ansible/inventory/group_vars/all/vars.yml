# Auth key for enrolling tag-owned infrastructure nodes. Ephemeral operator
# credential (rotates ~90 days), so it comes from the environment rather than
# vault.
tailscale_authkey: "{{ lookup('env', 'TAILSCALE_INFRA_AUTHKEY') }}"

postgres_superuser_password: "{{ vault_postgres_superuser_password }}"

memento_db_password: "{{ vault_memento_db_password }}"

garage_rpc_secret: "{{ vault_garage_rpc_secret }}"
garage_admin_token: "{{ vault_garage_admin_token }}"

pihole_pwhash: "{{ vault_pihole_pwhash }}"

ghcr_read_token: "{{ vault_ghcr_read_token }}"
